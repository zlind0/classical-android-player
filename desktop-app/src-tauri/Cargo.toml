[package]
name = "aurora-desktop"
version = "0.1.0"
description = "Aurora LAN library host for desktop"
authors = ["Aurora"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "aurora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
rusqlite = { version = "0.41", features = ["bundled"] }
lofty = "0.25"
walkdir = "2"
mdns-sd = "0.21"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
